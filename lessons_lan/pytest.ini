# Project: Homeschool Lessons (Dream.OS)
# File: pytest.ini
# Purpose: Pytest configuration for automated tests.
# Owner: Local family deployment (homeschool)
[pytest]
testpaths = tests
addopts =
    -q
    -p no:anyio
    -p no:asyncio
    -p no:benchmark
    -p no:dash
    -p no:faker
    -p no:html
    -p no:langsmith_plugin
    -p no:metadata
    -p no:pytest_cov
    -p no:pytest_jsonreport
    -p no:pytestqt
    -p no:randomly
    -p no:repeat
    -p no:rerunfailures
    -p no:sugar
    -p no:timeout
    -p no:xdist
